# ==============================================================================
# GoPlay — Complete Production Stack (Web + Admin + API + Postgres + Valkey)
# Target: GCP Compute Engine VM (innoserver-serv001: 34.41.116.217)
# Port Block (per ITG/shared-infra/PORT_ALLOCATION_CREDENTIALS_AND_ONBOARDING.md):
#   - 3300: goplay-web (Competitive & Tournament Games Portal for telebirr)
#   - 3302: goplay-api (Fastify Telebirr C2B/B2C API)
#   - 3303: goplay-admin (Operations & Auditor Console)
#   - 5434: goplay-postgres (PostgreSQL 16)
#   - 6384: goplay-valkey (Valkey 8)
# ==============================================================================

services:
  # ── PostgreSQL 16 Enterprise Relational Store ────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: goplay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-goplay_db}
      POSTGRES_USER: ${POSTGRES_USER:-goplay_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-goplay_secure_prod_password_2026}
    volumes:
      - goplay_pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5434:5432"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-goplay_app} -d ${POSTGRES_DB:-goplay_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Valkey 8.x Distributed High-Performance Cache ───────────────────────────
  valkey:
    image: valkey/valkey:8-alpine
    container_name: goplay-valkey
    restart: unless-stopped
    command: ["valkey-server", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6384:6379"
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── GoPlay Fastify API ───────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: goplay-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3302
      HOST: 0.0.0.0
      DOMAIN: innopulseplatform.com
      DATABASE_URL: "postgresql://${POSTGRES_USER:-goplay_app}:${POSTGRES_PASSWORD:-goplay_secure_prod_password_2026}@postgres:5432/${POSTGRES_DB:-goplay_db}?sslmode=disable"
      VALKEY_URL: "redis://valkey:6379"
      JWT_SECRET: ${JWT_SECRET:-goplay-telebirr-jwt-secret-key-prod-2026}
      TELEBIRR_MODE: ${TELEBIRR_MODE:-live}
      TELEBIRR_APP_KEY: ${TELEBIRR_APP_KEY:-}
      TELEBIRR_APP_ID: ${TELEBIRR_APP_ID:-}
      TELEBIRR_CHECKOUT_URL: ${TELEBIRR_CHECKOUT_URL:-https://telebirr.et/checkout}
      TELEBIRR_NOTIFY_URL: ${TELEBIRR_NOTIFY_URL:-https://goplay-api.innopulseplatform.com/api/v1/payments/webhook}
      TELEBIRR_RETURN_URL: ${TELEBIRR_RETURN_URL:-https://goplay.innopulseplatform.com/#/profile}
      DEFAULT_TEST_MSISDN: ${DEFAULT_TEST_MSISDN:-0977057270}
    ports:
      - "127.0.0.1:3302:3302"
    deploy:
      resources:
        limits:
          memory: 384M
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3302/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ── Dedicated Admin Console ─────────────────────────────────────────────────
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile.admin
    container_name: goplay-admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3303
    ports:
      - "127.0.0.1:3303:3303"
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3303/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ── Public Player Web Portal (Competitive & Tournament Games) ───────────────
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.web
    container_name: goplay-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3300
    ports:
      - "127.0.0.1:3300:3300"
    deploy:
      resources:
        limits:
          memory: 384M
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3300/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  goplay_pgdata:
