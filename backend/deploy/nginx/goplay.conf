# ==============================================================================
# Host Nginx Configuration for GoPlay
# Domain: innopulseplatform.com
# Upstreams:
#   - goplay_api: 127.0.0.1:3302 (Customer & Player Game Center API)
#   - goplay_admin: 127.0.0.1:3303 (Dedicated Admin & Auditor Operations Console)
# ==============================================================================

upstream goplay_api {
    server 127.0.0.1:3302;
    keepalive 32;
}

upstream goplay_admin {
    server 127.0.0.1:3303;
    keepalive 16;
}

# ------------------------------------------------------------------------------
# 1. Player API Subdomain: goplay-api.innopulseplatform.com
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name goplay-api.innopulseplatform.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name goplay-api.innopulseplatform.com;

    ssl_certificate /etc/letsencrypt/live/innopulseplatform.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/innopulseplatform.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://goplay_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}

# ------------------------------------------------------------------------------
# 2. Dedicated Admin Operations Portal: goplay-admin.innopulseplatform.com
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name goplay-admin.innopulseplatform.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name goplay-admin.innopulseplatform.com;

    ssl_certificate /etc/letsencrypt/live/innopulseplatform.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/innopulseplatform.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://goplay_admin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
